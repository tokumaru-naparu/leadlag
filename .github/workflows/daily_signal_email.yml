name: daily-signal-email

on:
  workflow_dispatch:
  schedule:
    # 平日 07:00 JST (22:00 UTC 前日) ← 寄り付き前に届く
    - cron: "0 22 * * 0-4"

permissions:
  contents: write

jobs:
  run-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance scikit-learn jpholiday

      - name: Run daily pipeline (fetch + PCA + update CSVs)
        run: |
          mkdir -p data/raw data/processed output/results
          python scripts/update_daily_pipeline.py > output/results/pipeline_run_output.txt 2>&1
          cat output/results/pipeline_run_output.txt

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/us_etf.csv data/raw/jp_etf.csv \
                  data/processed/signals.csv data/processed/trades.csv \
                  data/processed/performance.csv || true
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"
          git push || echo "Push skipped (nothing to push)"

      - name: Run daily signal script
        run: |
          python scripts/08_signal_today.py > output/results/daily_run_output.txt 2>&1 || true

      - name: Send daily report email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          DAILY_RUN_LOG_PATH: output/results/daily_run_output.txt
        run: |
          python scripts/send_daily_email_report.py
