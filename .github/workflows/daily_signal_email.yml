name: daily-signal-email

on:
  workflow_dispatch:
  schedule:
    # 平日 09:10 JST (00:10 UTC)
    - cron: "10 0 * * 1-5"

jobs:
  run-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy jpholiday

      - name: Run daily signal script
        run: |
          mkdir -p output/results
          python scripts/08_signal_today.py > output/results/daily_run_output.txt 2>&1 || true

      - name: Send daily report email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          DAILY_RUN_LOG_PATH: output/results/daily_run_output.txt
        run: |
          python scripts/send_daily_email_report.py
